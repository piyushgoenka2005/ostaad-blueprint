# Cloudflare Configuration for Ostaad Blueprint-to-BOQ Engine
name = "ostaad-blueprint-boq"
main = "worker.js"
compatibility_date = "2024-04-01"

# Standalone custom domain route on Cloudflare Edge
# Dedicated exclusively to blueprint.ostaad.shop with ZERO connection to ostaad.shop
routes = [
  { pattern = "blueprint.ostaad.shop", custom_domain = true }
]

[vars]
# In production, replace with your backend container or Cloudflare Tunnel origin
BACKEND_ORIGIN = "http://127.0.0.1:8000"
