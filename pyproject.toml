[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ostaad-boq"
version = "1.0.0"
description = "Clean-room, production-grade Blueprint-to-BOQ Takeoff Engine for architectural drawings (PDF, PNG, JPG)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ostaad Architecture Team" }]
keywords = [
    "construction",
    "AEC",
    "blueprint",
    "takeoff",
    "BOQ",
    "bill-of-quantities",
    "computer-vision",
    "document-ai"
]

dependencies = [
    "pydantic>=2.6.0,<3",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "pymupdf>=1.24.0",
    "easyocr>=1.7.1",
    "openpyxl>=3.1.2",
    "shapely>=2.0.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
ostaad-boq = "ostaad_boq.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
